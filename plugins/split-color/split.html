<style>
html,body{background:transparent}
body{margin:0;padding:16px;color:var(--st-text,#eee);font:14px/1.5 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--st-muted,#999)}
.card{background:var(--st-card,#1b1b1b);border:1px solid var(--st-border,#333);border-radius:8px;padding:14px;margin-bottom:12px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:inherit;margin:10px 0 0}label.chk input{width:auto}
label{display:block;font-size:12px;color:var(--st-muted,#999);margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit;cursor:pointer}
button.primary{background:var(--st-accent,#4ea1d3);border-color:transparent;color:#fff}
button:disabled{opacity:.5;cursor:default}
.files{max-height:380px;overflow:auto;margin-top:8px;padding:8px;border:1px solid var(--st-border,#333);border-radius:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.files .f{cursor:pointer;border:1px solid var(--st-border,#333);border-radius:8px;overflow:hidden;background:var(--st-panel,#161616);display:flex;flex-direction:column}
.files .f.sel{outline:2px solid var(--st-accent,#4ea1d3);background:color-mix(in srgb,var(--st-accent,#4ea1d3) 22%,transparent)}
.files .th{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.12);font-size:26px;opacity:1}
.files .th img{width:100%;height:100%;object-fit:contain;display:block}
.files .nm{padding:5px 7px;font-size:12px;line-height:1.25;word-break:break-all;max-height:3.9em;overflow:hidden}
.files .none{grid-column:1/-1;padding:6px}
#dest{display:none;flex:2 1 320px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0 6px;font-size:13px}
.crumb button{padding:2px 8px;font-size:12px}
.dirs{max-height:170px;overflow:auto;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.dirs div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--st-border,#333);display:flex;gap:8px;align-items:center}
.dirs div:last-child{border-bottom:0}.dirs div:hover{background:color-mix(in srgb,var(--st-accent,#4ea1d3) 16%,transparent)}
.dirs .none{cursor:default;opacity:.7}.dirs .none:hover{background:none}
.srcrow{display:flex;gap:8px;align-items:center}.srcrow select{flex:1 1 0;width:auto;min-width:0}.srcrow .dsel{margin-top:0;flex:none}
.dsel{display:flex;gap:8px;align-items:center;margin-top:8px}.dsel button{background:transparent;border-color:transparent;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.dsel button:hover{background:color-mix(in srgb,var(--st-text,#eee) 8%,transparent)}.dsel #mkopen{flex:1}.mi{display:inline-flex;color:var(--st-accent,#4ea1d3)}.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50}.mo .md{background:var(--st-panel,#1e2129);border:1px solid var(--st-border,#2a2f3a);border-radius:16px;padding:28px;max-width:450px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.6)}.mo h3{margin:0 0 14px;font-size:18px;display:flex;gap:12px;align-items:center}.mo h3 .mi svg{width:24px;height:24px}.mo p{margin:0 0 14px;opacity:.75;line-height:1.5}.mo input{padding:12px 16px;border:2px solid var(--st-border,#2a2f3a);border-radius:10px;margin-bottom:20px;background:var(--st-bg,#161a22)}.mo input:focus{outline:none;border-color:var(--st-accent,#4ea1d3);box-shadow:0 0 0 3px color-mix(in srgb,var(--st-accent,#4ea1d3) 35%,transparent)}.mo .bt button:not(.primary){background:var(--st-hover,#2a2f3a)}.mo .bt{display:flex;gap:12px;justify-content:flex-end}.mo .bt button{padding:11px 24px;border-radius:10px;border:none}.mo .bt .primary{font-weight:600}.mk{display:flex;gap:8px;margin-top:8px}.mk input{flex:1}
.here{margin-top:6px;font-size:12px;opacity:.85}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dotb 1.2s infinite ease-in-out both}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
#view{display:none;margin-top:14px}
#view .hint{font-size:12px;opacity:.7;margin-bottom:8px}
#view .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#view .card{border:1px solid var(--st-border,#333);border-radius:8px;background:var(--st-panel,#161616);overflow:hidden}
#view canvas{width:100%;height:auto;aspect-ratio:1;display:block;cursor:grab;touch-action:none}
#view .cap{padding:5px 8px;font-size:12px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--st-border,#333)}
#view .cap i{width:12px;height:12px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#big{display:none;margin-top:10px;gap:12px;align-items:center}
#big button{flex:none}
#big img{width:96px;height:96px;object-fit:contain;border-radius:8px;border:1px solid var(--st-border,#333);background:rgba(127,127,127,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.chip i{width:14px;height:14px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#msg{margin-top:10px;padding:9px 11px;border-radius:6px;border:1px solid var(--st-border,#333);display:none}
#msg.finished{display:flex!important;align-items:center;gap:14px;padding:16px 18px;border:2px solid var(--st-success,#30a46c);background:color-mix(in srgb,var(--st-success,#30a46c) 14%,transparent);animation:pop .45s ease-out}#msg.finished .tick{flex:none;width:38px;height:38px;border-radius:50%;background:var(--st-success,#30a46c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}#msg.finished b{display:block;font-size:15px}#msg.finished small{opacity:.8}@keyframes pop{0%{transform:scale(.96);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
#msg.err{border-color:var(--st-danger,#e5484d)}#msg.ok{border-color:var(--st-success,#30a46c)}
.cuts .cut{display:flex;gap:8px;align-items:center;margin:6px 0}.cuts .cut select{width:72px;flex:none}.cuts .cut input[type=range]{flex:1;padding:0}.cuts .cut input[type=number]{width:84px;flex:none}
.cuts .cut button{padding:4px 10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:16px;align-items:start}.wl{position:sticky;top:8px}@media(max-width:900px){.work{grid-template-columns:1fr}.wl{position:static}}
#stage,#r_stage{max-width:calc((100vh - 330px)*4/3);margin:0 auto}#stage{position:relative}#stage canvas{width:100%;height:auto;aspect-ratio:4/3;display:block;border:1px solid var(--st-border,#333);border-radius:8px;background:rgba(127,127,127,.08);cursor:grab;touch-action:none}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pl .chip small{opacity:.7}
.hint{font-size:12px;opacity:.7}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg>div{flex:1;min-width:140px}
h2{font-size:14px;margin:0 0 6px}
.parts:empty{display:none}.parts{max-height:138px;overflow-y:auto;padding-right:6px;margin-top:4px;border-top:1px solid var(--st-border,#333);border-bottom:1px solid var(--st-border,#333)}
.prow{display:flex;align-items:center;gap:8px;margin:6px 0}.prow input[type=color]{width:42px;height:34px;padding:2px;flex:none}.prow .pn{flex:1;min-width:0}.prow small{opacity:.7}.prow select.stk{width:44%;flex:none}
.oc{margin-top:16px;padding-top:12px;border-top:1px solid var(--st-border,#333)}.oc .btns{margin-top:10px}.oc .row>div{min-width:120px}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.tabs button{padding:8px 16px;border-radius:8px;background:var(--st-panel,#161616)}
.tabs button.on{background:var(--st-accent,#4ea1d3);border-color:transparent;color:#fff}
.slot:empty{display:none}
.seg.rg>div{flex:1 1 100%}.seg.rg label{white-space:nowrap}
</style>
<h1 id="t_title"></h1>
<p class="sub" id="t_intro"></p>
<div class="tabs" id="tabs"><button type="button" id="tab_colors" class="on"></button><button type="button" id="tab_regions"></button></div>
<div class="card" id="pickcard">
  <div id="pick">
    <label id="t_search"></label>
    <input id="q" type="search" autocomplete="off">
    <div class="files" id="files"></div>
  </div>
</div>

<div class="card" id="pc" style="display:none">
  <div class="hint" id="t_modeh" style="font-size:12px;opacity:.7;margin:0 0 8px"></div>
  <div class="row"><div id="tolbox"><label id="t_tol"></label><input id="tol" type="number" min="0" max="100" step="5" value="0"></div></div>
  <div class="slot" id="slot_c_opts"></div>
  <div class="slot" id="slot_c_out"></div>
  <div class="chips" id="chips"></div>
  <div id="view"><div class="hint" id="t_view"></div><div class="grid" id="vgrid"></div></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button id="analyze"></button><button id="run" class="primary" disabled></button><button type="button" id="chg" style="display:none"></button>
  </div>
  <div class="slot" id="slot_c_msg"></div>
</div>

<div class="card work" id="r_work" style="display:none">
  <div class="wl">
    <div id="r_stage"><canvas id="r_cvg" width="800" height="600"></canvas><div id="r_nogl" class="hint" style="display:none"></div></div>
    <div class="hint" id="r_t_hint" style="margin-top:6px"></div>
  </div>
  <div class="wr">
    <div class="hint" id="r_t_dims"></div>
    <h2 id="r_t_modeh" style="margin-top:10px"></h2>
    <div class="seg">
      <div><label id="r_t_mode"></label><select id="r_mode"><option value="auto"></option><option value="shells"></option><option value="seeds"></option></select></div>
      <div id="r_partsbox"><label id="r_t_parts"></label><input id="r_parts" type="number" min="2" max="12" value="3"></div>
      <div id="r_creasebox"><label id="r_t_crease"></label><select id="r_crease"><option value="low"></option><option value="medium" selected></option><option value="high"></option></select></div>
    </div>
    <div class="hint" id="r_t_modehint" style="margin-top:6px"></div>
    <div class="btns" id="r_seedbtns" style="display:none"><button type="button" id="r_undo"></button><button type="button" id="r_clear"></button></div>
    <h2 id="r_t_partsh" style="margin-top:16px"></h2>
    <div class="btns" style="margin-top:0"><button type="button" id="r_fillstock"></button></div>
    <div class="parts" id="r_plist"></div>
    <h2 id="r_t_out" style="margin-top:16px"></h2>
    <select id="r_out"><option value="paint"></option><option value="plates"></option></select>
    <div class="hint" id="r_t_outh" style="margin-top:6px"></div>
    <div class="slot" id="slot_r_opts"></div>
    <div class="slot oc" id="slot_r_out"></div>
    <div class="btns"><button id="r_run" class="primary" disabled></button><button type="button" id="r_chg" style="display:none"></button></div>
    <div class="slot" id="slot_r_msg"></div>
  </div>
</div>

<!-- blocs partagés : déplacés dans l'onglet actif -->
<div id="shared" hidden>
  <div id="shopts">
    <div class="row">
      <div><label id="t_mg"></label><input id="mg" type="number" min="0" max="500" step="1" value="5"></div>
      <div><label>&nbsp;</label><span class="hint" id="t_mgh" style="font-size:12px;opacity:.7"></span></div>
    </div>
    <div class="cnrow">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="cn" checked style="width:auto"><span id="t_cn"></span></label>
      <div class="hint" id="t_cnh" style="font-size:12px;opacity:.7;margin:4px 0 8px"></div>
      <div class="row" id="cnopts" style="display:none">
        <div><label id="t_cd"></label><input id="cd" type="number" min="0" max="30" step="0.5" value="0"></div>
        <div><label id="t_cl"></label><input id="cl" type="number" min="0" max="40" step="0.5" value="0"></div>
        <div><label id="t_cc"></label><input id="cc" type="number" min="0" max="1" step="0.05" value="0.2"></div>
      </div>
    </div>
  </div>
  <div id="outbox">
    <div class="row"><div style="flex:2 1 200px"><label id="t_name"></label><input id="name" maxlength="120"></div><div style="min-width:90px"><label id="t_bw"></label><input id="bw" type="number" min="50" value="220"></div><div style="min-width:90px"><label id="t_bd"></label><input id="bd" type="number" min="50" value="220"></div></div>
    <div>
      <label id="t_src"></label>
      <div class="srcrow"><select id="src"></select><div class="dsel"><button type="button" id="mkopen"></button><button type="button" id="browse" class="ico"></button></div></div>
      <div class="hint" id="t_savehint" style="font-size:12px;opacity:.7;margin-top:6px"></div>
      <div class="here" id="here"></div>
    </div>
    <div class="hint" id="t_bedh" style="font-size:12px;opacity:.7;margin:4px 0 8px"></div>
  </div>
  <div id="msg"></div>
</div>

let L='fr',sel=null,sources=[],TAB='colors',RG=null;
const $=id=>document.getElementById(id),t=k=>(T[L]||T.en)[k]||T.en[k]||k;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function labels(){const m={t_title:'title',t_intro:'intro',t_search:'search',t_name:'name',t_tol:'tol',t_src:'src',t_bw:'bw',t_bd:'bd',t_view:'view',t_mg:'mg',t_mgh:'mgh',t_cn:'cn',t_cnh:'cnh',t_cd:'cd',t_cl:'cl',t_cc:'cc',t_modeh:'modeh'};
  for(const k in m)$(k).textContent=t(m[k]);$('tab_colors').textContent=t('tabC');$('tab_regions').textContent=t('tabR');if(RG)RG.labels();$('analyze').textContent=t('analyze');$('run').textContent=t('run');$('mkopen').innerHTML='<span class="mi">'+ICO_PLUS+'</span> ';$('mkopen').appendChild(document.createTextNode(t('mkopen')));$('browse').innerHTML=ICO_OPEN;$('browse').title=t('browse');$('t_savehint').textContent=t('savehint');$('t_bedh').textContent=t('bedh');if($('here'))$('here').textContent=hereTxt();}
function isReg(){return TAB==='regions'}
/* Blocs partagés (nom, dossier, plateau, options de connecteurs, message) : déplacés dans l'onglet actif. */
function place(){const c=TAB==='colors',pl=!c&&RG&&RG.plates();
  $((c?'slot_c_opts':'slot_r_opts')).appendChild($('shopts'));$('shopts').style.display=c||pl?'':'none';
  $((c?'slot_c_out':'slot_r_out')).appendChild($('outbox'));$((c?'slot_c_msg':'slot_r_msg')).appendChild($('msg'))}
function setTab(tab,keep){TAB=tab;$('tab_colors').classList.toggle('on',tab==='colors');$('tab_regions').classList.toggle('on',tab==='regions');
  $('pc').style.display=tab==='colors'&&sel?'':'none';if(tab==='colors')$('r_work').style.display='none';
  $('t_modeh').textContent=t('modeh');$('tolbox').style.display='';place();
  if(!keep){sel=null;collapse(false);$('chips').innerHTML='';renderView(null);$('run').disabled=true;msg('');showBig();if(RG)RG.reset();search()}}
$('tab_colors').onclick=()=>{if(TAB!=='colors')setTab('colors')};$('tab_regions').onclick=()=>{if(TAB!=='regions')setTab('regions')};
function msg(txt,cls){const m=$('msg');m.textContent=cls==='busy'?String(txt).replace(/[\u2026.]+$/,''):txt;m.className=cls||'';if(cls==='busy'){const d=document.createElement('span');d.className='dots';d.innerHTML='<i></i><i></i><i></i>';m.appendChild(d)}m.style.display=txt?'block':'none'}
function finished(d){const m=$('msg');m.className='finished';m.innerHTML='';
  const k=document.createElement('div');k.className='tick';k.textContent='\u2713';const w=document.createElement('div');
  const b=document.createElement('b');b.textContent=t('fin')+' \u2014 '+t('done').replace('{p}',d.plate_count).replace('{f}',d.output_filename);w.appendChild(b);
  const r=d.repair||{},cn=d.connectors||{};const parts=[];if(r.filled)parts.push(t('fixed').replace('{n}',r.filled));if(cn.made)parts.push(t('conns').replace('{n}',cn.made));if(cn.error)parts.push(t('connoff'));if(d.too_big)parts.push(t('big'));const sm=document.createElement('small');sm.textContent=parts.join(' \u00b7 ');if(sm.textContent)w.appendChild(sm);
  m.appendChild(k);m.appendChild(w);m.style.display='flex';try{m.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}}
const thumbs=new Map();
function mime(b){const u=new Uint8Array(b);if(u[0]===0x89&&u[1]===0x50)return'image/png';if(u[0]===0xff&&u[1]===0xd8)return'image/jpeg';return'image/webp'}
let thN=0;const thQ=[];   // au plus 3 miniatures demandées en même temps : l'application reste fluide
function thNext(){while(thN<3&&thQ.length){const j=thQ.shift();thN++;j().finally(()=>{thN--;thNext()})}}
function thumbUrl(path){
  if(!thumbs.has(path))thumbs.set(path,new Promise(ok=>{thQ.push(()=>window.stellio.api('/api/thumb?path='+encodeURIComponent(path),'arraybuffer')
    .then(b=>ok(URL.createObjectURL(new Blob([b],{type:mime(b)})))).catch(()=>ok(null)));thNext()}));
  return thumbs.get(path);
}
function fill(el,path){thumbUrl(path).then(u=>{if(u){el.innerHTML='';const i=new Image();i.alt='';i.src=u;el.appendChild(i)}})}
let io=null;
function lazy(el,path){
  if(!('IntersectionObserver' in window))return fill(el,path);
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fill(e.target,e.target.dataset.p)}}),{root:$('files'),rootMargin:'120px'});
  el.dataset.p=path;io.observe(el);
}
function collapse(on){$('pickcard').style.display=on?'none':'';if(!on){try{$('pickcard').scrollIntoView({block:'nearest'})}catch(e){}}}
$('chg').onclick=$('r_chg').onclick=()=>collapse(false);
function showBig(){['chg','r_chg'].forEach(i=>{const b=$(i);b.style.display=sel?'':'none';b.textContent=t('change')})}
async function search(){
  try{const d=await window.stellio.api('/api/x/split-color/files?q='+encodeURIComponent($('q').value.trim())+(isReg()?'&stl=1':''));
    const box=$('files');if(io)io.disconnect();
    box.innerHTML=(d.files||[]).map((f,i)=>`<div class="f${sel&&sel.path===f.path?' sel':''}" data-i="${i}" title="${esc(f.path)}"><div class="th"><i>&#9638;</i></div><div class="nm">${esc(f.name)}</div></div>`).join('')||`<div class="none">${esc(t('none'))}</div>`;
    box.querySelectorAll('.f').forEach(el=>{const f=d.files[+el.dataset.i];lazy(el.querySelector('.th'),f.path);
      el.onclick=()=>{sel=f;$('pc').style.display='';box.querySelectorAll('.f').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');showBig();collapse(true);
        if(isReg()){RG.choose(f);return}
        $('name').value=sel.name.replace(/\.(3mf|stl)$/i,'')+'_couleurs';$('chips').innerHTML='';renderView(null);$('run').disabled=true;msg('');setTimeout(()=>{if(sel===f)$('analyze').click()},50);}});
  }catch(e){msg(e.message,'err')}
}

const VW={yaw:-0.6,el:0.62},views=[];
function decode(p){const s=atob(p.tris),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Int16Array(u.buffer)}
function shade(hex,k){const n=parseInt(hex.slice(1),16);return'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(c=>Math.round(c*k)).join(',')+')'}
function draw(cv,list,R){
  const ctx=cv.getContext('2d'),W=cv.width,cy=Math.cos(VW.yaw),sy=Math.sin(VW.yaw),ce=Math.cos(VW.el),se=Math.sin(VW.el),sc=W/2/R*0.86;
  ctx.clearRect(0,0,W,W);const items=[];
  list.forEach(pc=>{const a=pc.a,n=a.length/9;for(let i=0;i<n;i++){const o=i*9,P=[];

  $('seedbtns').style.display=m==='seeds'?'flex':'none';$('t_modehint').textContent=t('h_'+m);$('t_hint').textContent=m==='seeds'?t('hint_seeds'):t('hint')}

/* ── stock de filament ── */
async function loadStock(){
  try{const d=await window.stellio.api('/api/filament/spools'),map=new Map();
    (d.slots||[]).forEach(s=>{let hx=String(s.color_hex||'').trim();if(/^[0-9a-f]{6}$/i.test(hx))hx='#'+hx;if(!/^#[0-9a-f]{6}$/i.test(hx))return;hx=hx.toUpperCase();
      const key=[s.name,s.material,hx].join('|'),rem=(s.remaining_g==null?null:+s.remaining_g);
      if(!map.has(key))map.set(key,{hex:hx,name:s.name||hx,type:s.material||'PLA',rem})});
    stock=[...map.values()].filter(s=>s.rem==null||s.rem>0)}catch(e){stock=[]}
  $('fillstock').style.display=stock.length?'':'none'}
$('fillstock').onclick=()=>{const seen=new Set(),list=stock.filter(s=>!seen.has(s.hex)&&seen.add(s.hex));
  for(let i=0;i<NPART;i++)if(list[i])PAL[i]={hex:list[i].hex,name:list[i].name,type:list[i].type};renderParts();recolor()};
function renderParts(){const box=$('plist');box.innerHTML='';
  for(let i=0;i<NPART;i++){const p=PAL[i],row=document.createElement('div');row.className='prow';
    row.innerHTML=`<input type="color" value="${esc(p.hex.toLowerCase())}"><span class="pn"><b>${esc(t('part'))} ${i+1}</b> <small>${f1(SHARE[i]||0)} %</small></span>`;
    const c=row.firstChild;c.oninput=()=>{PAL[i]={hex:c.value.toUpperCase(),name:t('filament').replace('{n}',i+1),type:'PLA'};recolor()};
    if(stock.length){const s=document.createElement('select');s.className='stk';s.innerHTML=`<option value="">${esc(t('stockopt'))}</option>`+stock.map((x,k)=>`<option value="${k}">${esc(x.name)} · ${esc(x.type)}</option>`).join('');
      s.onchange=()=>{if(s.value==='')return;const x=stock[+s.value];PAL[i]={hex:x.hex,name:x.name,type:x.type};c.value=x.hex.toLowerCase();recolor()};row.appendChild(s)}
    box.appendChild(row)}}
function ensurePal(n){for(let i=0;i<n;i++)if(!PAL[i])PAL[i]={hex:DEF[i%DEF.length],name:t('filament').replace('{n}',i+1),type:'PLA'};NPART=n}

/* ── rendu 3D WebGL ── */
const VW={yaw:-0.6,el:0.62,zoom:1};
const VS=`attribute vec3 aPos;attribute vec3 aNrm;attribute vec3 aCol;uniform vec4 uT;uniform vec2 uSc;uniform float uInvR;uniform float uPt;uniform float uZ;varying vec3 vCol;varying float vK;
void main(){vec3 p=aPos;float x1=p.x*uT.x-p.y*uT.y;float y1=p.x*uT.y+p.y*uT.x;
gl_Position=vec4(x1*uSc.x,(p.z*uT.z+y1*uT.w)*uSc.y,(y1*uT.z-p.z*uT.w)*uInvR*0.9+uZ,1.0);gl_PointSize=uPt;
float nx=aNrm.x*uT.x-aNrm.y*uT.y;float ny=aNrm.x*uT.y+aNrm.y*uT.x;float vy=aNrm.z*uT.z+ny*uT.w;float vz=ny*uT.z-aNrm.z*uT.w;
vK=0.38+0.62*abs(-0.3*nx+0.45*vy+0.55*vz);vCol=aCol;}`;
const FS=`precision mediump float;varying vec3 vCol;varying float vK;uniform float uFlat;
void main(){if(uFlat>0.5){vec2 d=gl_PointCoord-0.5;float r=length(d);if(r>0.5)discard;gl_FragColor=vec4(r>0.38?vec3(0.0):vec3(1.0),1.0);return;}gl_FragColor=vec4(vCol*vK,1.0);}`;
let GL=null;
function b64(s,Cls){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Cls(u.buffer)}
function hexRGB(x){const n=parseInt(x.slice(1),16);return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]}
function setMesh(d){
  const P=b64(d.pos,Float32Array),I=b64(d.idx,Uint32Array),n=I.length/3,pos=new Float32Array(n*9),nrm=new Float32Array(n*9);
  for(let i=0;i<n*3;i++){const v=I[i]*3;pos[i*3]=P[v];pos[i*3+1]=P[v+1];pos[i*3+2]=P[v+2]}
  for(let f=0;f<n;f++){const o=f*9,ux=pos[o+3]-pos[o],uy=pos[o+4]-pos[o+1],uz=pos[o+5]-pos[o+2],vx=pos[o+6]-pos[o],vy=pos[o+7]-pos[o+1],vz=pos[o+8]-pos[o+2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;for(let k=0;k<3;k++){nrm[o+k*3]=nx;nrm[o+k*3+1]=ny;nrm[o+k*3+2]=nz}}
  M={pos,nrm,n,ext:d.extent,col:new Float32Array(n*9),up:false,colDirty:true};recolor()}
function recolor(){if(!M)return;const g=[0.62,0.67,0.74],pal=PAL.map(p=>hexRGB(p.hex));
  for(let f=0;f<M.n;f++){const c=LAB?pal[LAB[f]]||g:g;for(let k=0;k<3;k++){M.col[f*9+k*3]=c[0];M.col[f*9+k*3+1]=c[1];M.col[f*9+k*3+2]=c[2]}}M.colDirty=true;draw()}
function glInit(){
  if(GL!==null)return!!GL;
  try{const cv=$('cvg'),gl=cv.getContext('webgl',{antialias:true,alpha:true});if(!gl)throw 0;
    const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
    const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));
    ['aPos','aNrm','aCol'].forEach((n,i)=>gl.bindAttribLocation(p,i,n));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('link');
    const u={};['uT','uSc','uInvR','uPt','uZ','uFlat'].forEach(n=>u[n]=gl.getUniformLocation(p,n));
    GL={gl,cv,p,u,b:[gl.createBuffer(),gl.createBuffer(),gl.createBuffer()],pb:[gl.createBuffer(),gl.createBuffer(),gl.createBuffer()]};
    if(window.ResizeObserver)new ResizeObserver(()=>draw()).observe($('stage'));return true}
  catch(e){GL=false;$('cvg').style.display='none';$('nogl').style.display='block';return false}}
let raf=0;function draw(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})}
function camera(){const cw=GL.cv.width,ch=GL.cv.height,e=M.ext,R=Math.hypot(e[0],e[1],e[2])/2,sc=Math.min(cw,ch)/2/R*1.15*VW.zoom;
  return{cw,ch,R,sc,c:Math.cos(VW.yaw),s:Math.sin(VW.yaw),ce:Math.cos(VW.el),se:Math.sin(VW.el)}}
function render(){
  if(!M||!glInit())return;const{gl,cv,u}=GL,dpr=window.devicePixelRatio||1,cw=Math.max(200,Math.round($('stage').clientWidth*dpr)),ch=Math.round(cw*3/4);
  if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
  if(!M.up){gl.bindBuffer(gl.ARRAY_BUFFER,GL.b[0]);gl.bufferData(gl.ARRAY_BUFFER,M.pos,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,GL.b[1]);gl.bufferData(gl.ARRAY_BUFFER,M.nrm,gl.STATIC_DRAW);M.up=true}
  if(M.colDirty){gl.bindBuffer(gl.ARRAY_BUFFER,GL.b[2]);gl.bufferData(gl.ARRAY_BUFFER,M.col,gl.DYNAMIC_DRAW);M.colDirty=false}
  const C=camera();
  gl.viewport(0,0,cw,ch);gl.clearColor(0,0,0,0);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(GL.p);gl.uniform4f(u.uT,C.c,C.s,C.ce,C.se);gl.uniform2f(u.uSc,C.sc/(cw/2),C.sc/(ch/2));gl.uniform1f(u.uInvR,1/C.R);gl.uniform1f(u.uPt,1);gl.uniform1f(u.uZ,0);gl.uniform1f(u.uFlat,0);
  [0,1,2].forEach(i=>{gl.bindBuffer(gl.ARRAY_BUFFER,GL.b[i]);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,0,0)});
  gl.drawArrays(gl.TRIANGLES,0,M.n*3);
  if(seeds.length){const P=new Float32Array(seeds.length*3),Z=new Float32Array(seeds.length*3);
    seeds.forEach((f,i)=>{for(let k=0;k<3;k++)P[i*3+k]=(M.pos[f*9+k]+M.pos[f*9+3+k]+M.pos[f*9+6+k])/3});
    [0,1,2].forEach(i=>{gl.bindBuffer(gl.ARRAY_BUFFER,GL.pb[i]);gl.bufferData(gl.ARRAY_BUFFER,i===0?P:Z,gl.STREAM_DRAW);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,0,0)});
    gl.uniform1f(u.uPt,Math.max(12,Math.round(14*dpr)));gl.uniform1f(u.uZ,-0.03);gl.uniform1f(u.uFlat,1);gl.drawArrays(gl.POINTS,0,seeds.length)}}
/* sélection d'une face sous la souris : rayon dans l'espace du modèle (projection orthographique) */
function pickFace(px,py){
  const C=camera(),rect=GL.cv.getBoundingClientRect(),nx=((px-rect.left)/rect.width)*2-1,ny=1-((py-rect.top)/rect.height)*2;
  const x1=nx*(C.cw/2)/C.sc,Y=ny*(C.ch/2)/C.sc,d=-1e4,y1=d*C.ce+Y*C.se,z=Y*C.ce-d*C.se;
  const o=[x1*C.c+y1*C.s,-x1*C.s+y1*C.c,z],dir=[C.s*C.ce,C.c*C.ce,-C.se];let best=-1,bt=1e30;const P=M.pos;
  for(let f=0;f<M.n;f++){const i=f*9,ax=P[i],ay=P[i+1],az=P[i+2],e1x=P[i+3]-ax,e1y=P[i+4]-ay,e1z=P[i+5]-az,e2x=P[i+6]-ax,e2y=P[i+7]-ay,e2z=P[i+8]-az;
    const hx=dir[1]*e2z-dir[2]*e2y,hy=dir[2]*e2x-dir[0]*e2z,hz=dir[0]*e2y-dir[1]*e2x,a=e1x*hx+e1y*hy+e1z*hz;if(Math.abs(a)<1e-12)continue;
    const fi=1/a,sx=o[0]-ax,sy=o[1]-ay,sz=o[2]-az,u=fi*(sx*hx+sy*hy+sz*hz);if(u<0||u>1)continue;
    const qx=sy*e1z-sz*e1y,qy=sz*e1x-sx*e1z,qz=sx*e1y-sy*e1x,v=fi*(dir[0]*qx+dir[1]*qy+dir[2]*qz);if(v<0||u+v>1)continue;
    const tt=fi*(e2x*qx+e2y*qy+e2z*qz);if(tt>0&&tt<bt){bt=tt;best=f}}
  return best}
(()=>{const cv=$('stage');let drag=null,moved=0;cv.onpointerdown=ev=>{drag=[ev.clientX,ev.clientY];moved=0;cv.setPointerCapture(ev.pointerId);cv.style.cursor='grabbing'};
  cv.onpointermove=ev=>{if(!drag)return;moved+=Math.abs(ev.clientX-drag[0])+Math.abs(ev.clientY-drag[1]);VW.yaw+=(ev.clientX-drag[0])*0.012;VW.el=Math.max(-1.4,Math.min(1.4,VW.el+(ev.clientY-drag[1])*0.01));drag=[ev.clientX,ev.clientY];draw()};
  cv.onpointerup=ev=>{const click=drag&&moved<5;drag=null;cv.style.cursor=$('mode').value==='seeds'?'crosshair':'grab';
    if(click&&M&&GL&&$('mode').value==='seeds'){const f=pickFace(ev.clientX,ev.clientY);if(f>=0&&seeds.length<12&&!seeds.includes(f)){seeds.push(f);compute()}}};
  cv.onpointercancel=()=>{drag=null};cv.style.cursor='grab';
  cv.addEventListener('wheel',ev=>{ev.preventDefault();VW.zoom=Math.max(0.4,Math.min(5,VW.zoom*(ev.deltaY<0?1.1:0.9)));draw()},{passive:false})})();
function body(extra){return Object.assign({path:sel&&sel.path,mode:$('mode').value,parts:+$('parts').value||3,crease:$('crease').value,seeds,
  palette:PAL.slice(0,NPART).map(p=>({hex:p.hex,name:p.name,type:p.type})),bed_width:+$('bw').value||256,bed_depth:+$('bd').value||256,
  filename:$('name').value.trim(),source_id:curSid,target_subfolder:curSid?cur:''},extra||{})}
let ctimer=0,cseq=0;
function compute(){clearTimeout(ctimer);ctimer=setTimeout(doCompute,180)}
async function doCompute(){
  if(!sel||!M)return;const mode=$('mode').value;
  if(mode==='seeds'&&!seeds.length){LAB=null;NPART=0;SHARE=[];renderParts();recolor();$('run').disabled=true;return}
  const my=++cseq;msg(t('busy'),'busy');
  try{const d=await runJob('/api/x/split-color/region-run',body({dry_run:true}));if(my!==cseq)return;
    LAB=b64(d.labels,Uint8Array);SHARE=d.share;ensurePal(d.parts);renderParts();recolor();msg('');$('run').disabled=false}
  catch(e){if(my===cseq){msg(e.message,'err');$('run').disabled=true}}}
$('mode').onchange=()=>{seeds=[];modeUi();if(M){LAB=null;NPART=0;recolor();renderParts();compute()}$('stage').style.cursor=$('mode').value==='seeds'?'crosshair':'grab'};
['parts','crease'].forEach(i=>$(i).addEventListener('input',compute));
$('undo').onclick=()=>{seeds.pop();compute();draw()};$('clear').onclick=()=>{seeds=[];compute();draw()};
$('out').onchange=()=>{$('run').textContent=t(plates()?'run_plates':'run_paint');$('t_outh').textContent=t(plates()?'oh_plates':'oh_paint');place();
  const n=$('name').value;if(sel)$('name').value=sel.name.replace(/\.(3mf|stl)$/i,'')+(plates()?'_plateaux':'_regions')};
function rfinished(d){const m=$('msg');m.className='finished';m.innerHTML='';
  const k=document.createElement('div');k.className='tick';k.textContent='\u2713';const w=document.createElement('div');
  const b=document.createElement('b');b.textContent=t('fin')+' \u2014 '+t('done').replace('{p}',d.parts).replace('{f}',d.output_filename);w.appendChild(b);
  m.appendChild(k);m.appendChild(w);m.style.display='flex';try{m.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}}
$('run').onclick=async()=>{if(!sel)return msg(t('pick'),'err');if(!NPART)return msg(t('nopart'),'err');msg(t('busy'),'busy');$('run').disabled=true;
  try{
    if(plates()){   // une pièce découpée par région, un plateau par couleur : même moteur que l'onglet « couleurs »
      const b=body_s({mode:'regions',region_mode:$('mode').value,parts:+$('parts').value||3,crease:$('crease').value,seeds,palette:PAL.slice(0,NPART).map(p=>p.hex),
        filename:$('name').value.trim()});
      const d=await runJob('/api/x/split-color/split',b);window.__cols=d.colors;finished(d)}
    else{const d=await runJob('/api/x/split-color/region-run',body());rfinished(d)}}
  catch(e){msg(e.message,'err')}finally{$('run').disabled=false}};
async function init(){await loadStock();renderParts()}
function lit(){render();if(!GL)return -1;const gl=GL.gl,w=GL.cv.width,h=GL.cv.height,px=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);let n=0;for(let i=3;i<px.length;i+=4)if(px[i])n++;return n}
return{labels,choose,reset,plates,init,lit}
})();

place();labels();
</script>
