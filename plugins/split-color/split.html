<style>
:root{color-scheme:light dark}
html,body{background:transparent}
body{margin:0;padding:16px;color:var(--st-text,#eee);font:14px/1.5 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--st-muted,#999)}
.card{background:transparent;border:1px solid var(--st-border,#333);border-radius:8px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--st-muted,#999);margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit;cursor:pointer}
button.primary{background:var(--st-accent,#4ea1d3);border-color:transparent;color:#fff}
button:disabled{opacity:.5;cursor:default}
.files{max-height:380px;overflow:auto;margin-top:8px;padding:8px;border:1px solid var(--st-border,#333);border-radius:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.files .f{cursor:pointer;border:1px solid var(--st-border,#333);border-radius:8px;overflow:hidden;background:var(--st-panel,#161616);display:flex;flex-direction:column}
.files .f.sel{outline:2px solid var(--st-accent,#4ea1d3);background:color-mix(in srgb,var(--st-accent,#4ea1d3) 22%,transparent)}
.files .th{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.12);font-size:26px;opacity:1}
.files .th img{width:100%;height:100%;object-fit:contain;display:block}
.files .nm{padding:5px 7px;font-size:12px;line-height:1.25;word-break:break-all;max-height:3.9em;overflow:hidden}
.files .none{grid-column:1/-1;padding:6px}
#dest{display:none;flex:2 1 320px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0 6px;font-size:13px}
.crumb button{padding:2px 8px;font-size:12px}
.dirs{max-height:170px;overflow:auto;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.dirs div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--st-border,#333);display:flex;gap:8px;align-items:center}
.dirs div:last-child{border-bottom:0}.dirs div:hover{background:color-mix(in srgb,var(--st-accent,#4ea1d3) 16%,transparent)}
.dirs .none{cursor:default;opacity:.7}.dirs .none:hover{background:none}
.dsel{display:flex;gap:8px;align-items:center}.dsel select{flex:1}.dsel button{white-space:nowrap}.mk{display:flex;gap:8px;margin-top:8px}.mk input{flex:1}
.here{margin-top:6px;font-size:12px;opacity:.85}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dotb 1.2s infinite ease-in-out both}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
#view{display:none;margin-top:14px}
#view .hint{font-size:12px;opacity:.7;margin-bottom:8px}
#view .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#view .card{border:1px solid var(--st-border,#333);border-radius:8px;background:var(--st-panel,#161616);overflow:hidden}
#view canvas{width:100%;height:auto;aspect-ratio:1;display:block;cursor:grab;touch-action:none}
#view .cap{padding:5px 8px;font-size:12px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--st-border,#333)}
#view .cap i{width:12px;height:12px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#big{display:none;margin-top:10px;gap:12px;align-items:center}
#big img{width:96px;height:96px;object-fit:contain;border-radius:8px;border:1px solid var(--st-border,#333);background:rgba(127,127,127,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.chip i{width:14px;height:14px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#msg{margin-top:10px;padding:9px 11px;border-radius:6px;border:1px solid var(--st-border,#333);display:none}
#msg.err{border-color:var(--st-danger,#e5484d)}#msg.ok{border-color:var(--st-success,#30a46c)}
</style>

function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function labels(){const m={t_title:'title',t_intro:'intro',t_search:'search',t_name:'name',t_tol:'tol',t_src:'src',t_bw:'bw',t_bd:'bd',t_view:'view',t_ov:'ov',t_ovh:'ovh'};

const thumbs=new Map();
function mime(b){const u=new Uint8Array(b);if(u[0]===0x89&&u[1]===0x50)return'image/png';if(u[0]===0xff&&u[1]===0xd8)return'image/jpeg';return'image/webp'}
function thumbUrl(path){
  if(!thumbs.has(path))thumbs.set(path,window.stellio.api('/api/thumb?path='+encodeURIComponent(path),'arraybuffer')
    .then(b=>URL.createObjectURL(new Blob([b],{type:mime(b)}))).catch(()=>null));
  return thumbs.get(path);
}
function fill(el,path){thumbUrl(path).then(u=>{if(u){el.innerHTML='';const i=new Image();i.alt='';i.src=u;el.appendChild(i)}})}
let io=null;
function lazy(el,path){
  if(!('IntersectionObserver' in window))return fill(el,path);
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fill(e.target,e.target.dataset.p)}}),{root:$('files'),rootMargin:'120px'});
  el.dataset.p=path;io.observe(el);
}
function showBig(){const b=$('big');if(!sel){b.style.display='none';return}
  b.style.display='flex';b.innerHTML='<div class="th"></div><b></b>';b.lastChild.textContent=sel.name;
  const th=b.firstChild;th.style.cssText='width:96px;height:96px';thumbUrl(sel.path).then(u=>{if(u&&sel){const i=new Image();i.src=u;th.appendChild(i)}})}
async function search(){
  try{const d=await window.stellio.api('/api/x/split-color/files?q='+encodeURIComponent($('q').value.trim()));

    box.innerHTML=(d.files||[]).map((f,i)=>`<div class="f${sel&&sel.path===f.path?' sel':''}" data-i="${i}" title="${esc(f.path)}"><div class="th"><i>&#9638;</i></div><div class="nm">${esc(f.name)}</div></div>`).join('')||`<div class="none">${esc(t('none'))}</div>`;
    box.querySelectorAll('.f').forEach(el=>{const f=d.files[+el.dataset.i];lazy(el.querySelector('.th'),f.path);
      el.onclick=()=>{sel=f;box.querySelectorAll('.f').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
        $('name').value=sel.name.replace(/\.3mf$/i,'')+'_couleurs';$('chips').innerHTML='';renderView(null);$('run').disabled=true;msg('');showBig();setTimeout(()=>{if(sel===f)$('analyze').click()},50);}});
  }catch(e){msg(e.message,'err')}
}

const VW={yaw:-0.6,el:0.62},views=[];
function decode(p){const s=atob(p.tris),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Int16Array(u.buffer)}
function shade(hex,k){const n=parseInt(hex.slice(1),16);return'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(c=>Math.round(c*k)).join(',')+')'}
function draw(cv,list,R){
  const ctx=cv.getContext('2d'),W=cv.width,cy=Math.cos(VW.yaw),sy=Math.sin(VW.yaw),ce=Math.cos(VW.el),se=Math.sin(VW.el),sc=W/2/R*0.86;
  ctx.clearRect(0,0,W,W);const items=[];
  list.forEach(pc=>{const a=pc.a,n=a.length/9;for(let i=0;i<n;i++){const o=i*9,P=[];
    for(let j=0;j<3;j++){const x=a[o+j*3]/pc.q,y=a[o+j*3+1]/pc.q,z=a[o+j*3+2]/pc.q,x1=x*cy-y*sy,y1=x*sy+y*cy;P.push([x1,z*ce+y1*se,y1*ce-z*se])}
    const ux=P[1][0]-P[0][0],uy=P[1][1]-P[0][1],uz=P[1][2]-P[0][2],vx=P[2][0]-P[0][0],vy=P[2][1]-P[0][1],vz=P[2][2]-P[0][2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
    const k=0.38+0.62*Math.abs(-0.3*nx+0.45*ny+0.55*nz);
    items.push({P,d:(P[0][2]+P[1][2]+P[2][2])/3,c:pc.hex,k})}});
  items.sort((p,q)=>q.d-p.d);ctx.lineWidth=0.8;ctx.lineJoin='round';
  for(const it of items){const col=shade(it.c,it.k);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.beginPath();
    ctx.moveTo(W/2+it.P[0][0]*sc,W*0.56-it.P[0][1]*sc);ctx.lineTo(W/2+it.P[1][0]*sc,W*0.56-it.P[1][1]*sc);ctx.lineTo(W/2+it.P[2][0]*sc,W*0.56-it.P[2][1]*sc);ctx.closePath();ctx.fill();ctx.stroke()}
}
function redraw(){views.forEach(v=>draw(v.cv,v.list,v.R))}
function renderView(pv){
  const box=$('view'),g=$('vgrid');views.length=0;g.innerHTML='';
  if(!pv||!pv.pieces||pv.pieces.length<2){box.style.display='none';return}
  const ps=pv.pieces.map(p=>({hex:p.hex,q:pv.q,a:decode(p)}));
  const e=pv.extent,R=Math.max(1e-6,Math.hypot(e[0],e[1],e[2])/2);
  const cols=(window.__cols||[]).reduce((m,c)=>(m[c.hex]=c,m),{});
  const add=(label,list,hex,rr)=>{const card=document.createElement('div');card.className='card';const cv=document.createElement('canvas');cv.width=cv.height=360;
    const cap=document.createElement('div');cap.className='cap';if(hex){const i=document.createElement('i');i.style.background=hex;cap.appendChild(i)}
    const sp=document.createElement('span');sp.textContent=label;cap.appendChild(sp);card.appendChild(cv);card.appendChild(cap);g.appendChild(card);
    views.push({cv,list,R:rr||R});
    let drag=null;cv.onpointerdown=ev=>{drag=[ev.clientX,ev.clientY];cv.setPointerCapture(ev.pointerId);cv.style.cursor='grabbing'};
    cv.onpointermove=ev=>{if(!drag)return;VW.yaw+=(ev.clientX-drag[0])*0.012;VW.el=Math.max(-1.4,Math.min(1.4,VW.el+(ev.clientY-drag[1])*0.01));drag=[ev.clientX,ev.clientY];redraw()};
    cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'}};
  add(t('all'),ps);
  ps.forEach(p=>{const c=cols[p.hex],a=p.a,n=a.length;let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
    for(let i=0;i<n;i+=3)for(let k=0;k<3;k++){const v=a[i+k];if(v<lo[k])lo[k]=v;if(v>hi[k])hi[k]=v}
    const cx=Math.round((lo[0]+hi[0])/2),cy=Math.round((lo[1]+hi[1])/2),cz=Math.round((lo[2]+hi[2])/2),b=new Int16Array(n);   // pièce recentrée : comme sur son plateau
    for(let i=0;i<n;i+=3){b[i]=a[i]-cx;b[i+1]=a[i+1]-cy;b[i+2]=a[i+2]-cz}
    const r=Math.max(1e-6,Math.hypot(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2])/2/pv.q);
    add(p.hex+(c?' · '+c.percent+'%':''),[{hex:p.hex,q:pv.q,a:b}],p.hex,r)});
  box.style.display='block';redraw();
}

let cur='',curSid='';   // dossier choisi : source + sous-dossier relatif
function hereTxt(){const o=$('src').selectedOptions[0];return curSid?t('here')+(o?o.dataset.label:'')+(cur?' / '+cur.split('/').join(' / '):''):''}
const opened=new Set();
function addOpt(sid,sub,label,depth,after){const o=document.createElement('option');o.value=sid+'|'+sub;o.dataset.sid=sid;o.dataset.sub=sub;o.dataset.label=label;
  o.textContent='\u00A0\u00A0'.repeat(depth)+(depth?'\u21B3 ':'\uD83D\uDCC1 ')+(depth?sub.split('/').pop():label);after.after(o);return o}
async function expand(opt){const sid=opt.dataset.sid,sub=opt.dataset.sub,key=sid+'|'+sub;if(!sid||opened.has(key))return;opened.add(key);
  try{const d=await window.stellio.api('/api/x/split-color/folders?source_id='+encodeURIComponent(sid)+'&sub='+encodeURIComponent(sub));
    const depth=sub?sub.split('/').length:0;let prev=opt;
    (d.folders||[]).forEach(f=>{prev=addOpt(sid,(sub?sub+'/':'')+f,opt.dataset.label,depth+1,prev)})}catch(e){opened.delete(key)}}
async function pickDest(){const o=$('src').selectedOptions[0];
  if(!o||!o.dataset.sid){cur='';curSid='';$('here').textContent='';$('mkbox').style.display='none';return}
  curSid=o.dataset.sid;cur=o.dataset.sub||'';$('here').textContent=hereTxt();await expand(o)}
async function makeDir(){
  const name=$('newdir').value.trim();if(!name)return;if(!curSid)return msg(t('selfold'),'err');
  try{const d=await window.stellio.api('/api/x/split-color/mkdir','json',{method:'POST',body:{source_id:curSid,sub:cur,name}});
    const o=$('src').selectedOptions[0];await expand(o);
    let n=[...$('src').options].find(x=>x.value===curSid+'|'+d.sub);
    if(!n){let prev=o,i=$('src').selectedIndex+1;const dp=cur?cur.split('/').length:0;while($('src').options[i]&&$('src').options[i].dataset.sub.startsWith(cur?cur+'/':'')&&($('src').options[i].dataset.sub.split('/').length>dp)&&$('src').options[i].dataset.sid===curSid){prev=$('src').options[i];i++}n=addOpt(curSid,d.sub,o.dataset.label,dp+1,prev)}
    $('src').value=n.value;
    $('newdir').value='';$('mkbox').style.display='none';await pickDest()}catch(e){msg(e.message,'err')}
}
function body(extra){const s=$('src');return Object.assign({path:sel&&sel.path,bed_width:+$('bw').value||220,bed_height:+$('bd').value||220,tolerance:+$('tol').value||0,overlap:+$('ov').value||0,
  filename:$('name').value.trim(),source_id:curSid,target_subfolder:curSid?cur:''},extra||{})}
function chips(cols){$('chips').innerHTML=(cols||[]).map(c=>`<span class="chip"><i style="background:${esc(c.hex)}"></i>${esc(c.hex)} · ${c.percent}%${c.default?' · '+esc(t('def')):''}</span>`).join('')}
async function call(extra){return window.stellio.api('/api/x/split-color/split','json',{method:'POST',body:body(extra)})}
$('analyze').onclick=async()=>{if(!sel)return msg(t('pick'),'err');msg(t('busy'),'busy');$('run').disabled=true;
  try{const d=await call({dry_run:true});window.__cols=d.colors;chips(d.colors);renderView(d.preview);msg(t('found').replace('{n}',d.color_count),'ok');$('run').disabled=d.color_count<2}
  catch(e){msg(e.message,'err')}};
$('run').onclick=async()=>{if(!sel)return msg(t('pick'),'err');msg(t('busy'),'busy');$('run').disabled=true;
  try{const d=await call();window.__cols=d.colors;renderView(d.preview);msg(t('done').replace('{p}',d.plate_count).replace('{f}',d.output_filename)+(d.too_big?' — '+t('big'):''),d.too_big?'err':'ok')}
  catch(e){msg(e.message,'err')}finally{$('run').disabled=false}};
$('tol').onchange=$('ov').onchange=()=>{if(sel)$('analyze').click()};
let timer;$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,250)};
document.addEventListener('stellio-ready',async()=>{L=(window.stellio.lang||'fr').slice(0,2);if(!T[L])L='en';labels();
  try{sources=await window.stellio.api('/api/sources')}catch(e){sources=[]}
  $('src').innerHTML=`<option value="">${esc(t('same'))}</option>`;let prev=$('src').options[0];sources.filter(s=>!s.type||['folder','smb','nfs'].includes(s.type)).forEach(s=>{prev=addOpt(String(s.id),'',s.name||s.path,0,prev)});search()
  $('src').onchange=pickDest;$('mkopen').onclick=()=>{if(!curSid)return msg(t('selfold'),'err');$('mkbox').style.display=$('mkbox').style.display==='none'?'flex':'none';$('newdir').focus()};$('mkdir').onclick=makeDir;$('newdir').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();makeDir()}};});
labels();
</script>
