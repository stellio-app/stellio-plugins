<style>
html,body{background:transparent}
body{margin:0;padding:16px;color:var(--st-text,#eee);font:14px/1.5 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--st-muted,#999)}
.card{background:var(--st-card,#1b1b1b);border:1px solid var(--st-border,#333);border-radius:8px;padding:14px;margin-bottom:12px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:inherit;margin:10px 0 0}label.chk input{width:auto}
label{display:block;font-size:12px;color:var(--st-muted,#999);margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit;cursor:pointer}
button.primary{background:var(--st-accent,#4ea1d3);border-color:transparent;color:#fff}
button:disabled{opacity:.5;cursor:default}
.files{max-height:380px;overflow:auto;margin-top:8px;padding:8px;border:1px solid var(--st-border,#333);border-radius:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.files .f{cursor:pointer;border:1px solid var(--st-border,#333);border-radius:8px;overflow:hidden;background:var(--st-panel,#161616);display:flex;flex-direction:column}
.files .f.sel{outline:2px solid var(--st-accent,#4ea1d3);background:color-mix(in srgb,var(--st-accent,#4ea1d3) 22%,transparent)}
.files .th{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.12);font-size:26px;opacity:1}
.files .th img{width:100%;height:100%;object-fit:contain;display:block}
.files .nm{padding:5px 7px;font-size:12px;line-height:1.25;word-break:break-all;max-height:3.9em;overflow:hidden}
.files .none{grid-column:1/-1;padding:6px}
#dest{display:none;flex:2 1 320px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0 6px;font-size:13px}
.crumb button{padding:2px 8px;font-size:12px}
.dirs{max-height:170px;overflow:auto;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.dirs div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--st-border,#333);display:flex;gap:8px;align-items:center}
.dirs div:last-child{border-bottom:0}.dirs div:hover{background:color-mix(in srgb,var(--st-accent,#4ea1d3) 16%,transparent)}
.dirs .none{cursor:default;opacity:.7}.dirs .none:hover{background:none}
.srcrow{display:flex;gap:8px;align-items:center}.srcrow select{flex:1 1 0;width:auto;min-width:0}.srcrow .dsel{margin-top:0;flex:none}
.dsel{display:flex;gap:8px;align-items:center;margin-top:8px}.dsel button{background:transparent;border-color:transparent;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.dsel button:hover{background:color-mix(in srgb,var(--st-text,#eee) 8%,transparent)}.dsel #mkopen{flex:1}.mi{display:inline-flex;color:var(--st-accent,#4ea1d3)}.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50}.mo .md{background:var(--st-panel,#1e2129);border:1px solid var(--st-border,#2a2f3a);border-radius:16px;padding:28px;max-width:450px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.6)}.mo h3{margin:0 0 14px;font-size:18px;display:flex;gap:12px;align-items:center}.mo h3 .mi svg{width:24px;height:24px}.mo p{margin:0 0 14px;opacity:.75;line-height:1.5}.mo input{padding:12px 16px;border:2px solid var(--st-border,#2a2f3a);border-radius:10px;margin-bottom:20px;background:var(--st-bg,#161a22)}.mo input:focus{outline:none;border-color:var(--st-accent,#4ea1d3);box-shadow:0 0 0 3px color-mix(in srgb,var(--st-accent,#4ea1d3) 35%,transparent)}.mo .bt button:not(.primary){background:var(--st-hover,#2a2f3a)}.mo .bt{display:flex;gap:12px;justify-content:flex-end}.mo .bt button{padding:11px 24px;border-radius:10px;border:none}.mo .bt .primary{font-weight:600}.mk{display:flex;gap:8px;margin-top:8px}.mk input{flex:1}
.here{margin-top:6px;font-size:12px;opacity:.85}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dotb 1.2s infinite ease-in-out both}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
#view{display:none;margin-top:14px}
#view .hint{font-size:12px;opacity:.7;margin-bottom:8px}
#view .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#view .card{border:1px solid var(--st-border,#333);border-radius:8px;background:var(--st-panel,#161616);overflow:hidden}
#view canvas{width:100%;height:auto;aspect-ratio:1;display:block;cursor:grab;touch-action:none}
#view .cap{padding:5px 8px;font-size:12px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--st-border,#333)}
#view .cap i{width:12px;height:12px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#big{display:none;margin-top:10px;gap:12px;align-items:center}
#big button{flex:none}
#big img{width:96px;height:96px;object-fit:contain;border-radius:8px;border:1px solid var(--st-border,#333);background:rgba(127,127,127,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.chip i{width:14px;height:14px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#msg{margin-top:10px;padding:9px 11px;border-radius:6px;border:1px solid var(--st-border,#333);display:none}
#msg.finished{display:flex!important;align-items:center;gap:14px;padding:16px 18px;border:2px solid var(--st-success,#30a46c);background:color-mix(in srgb,var(--st-success,#30a46c) 14%,transparent);animation:pop .45s ease-out}#msg.finished .tick{flex:none;width:38px;height:38px;border-radius:50%;background:var(--st-success,#30a46c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}#msg.finished b{display:block;font-size:15px}#msg.finished small{opacity:.8}@keyframes pop{0%{transform:scale(.96);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
#msg.err{border-color:var(--st-danger,#e5484d)}#msg.ok{border-color:var(--st-success,#30a46c)}
.cuts .cut{display:flex;gap:8px;align-items:center;margin:6px 0}.cuts .cut select{width:72px;flex:none}.cuts .cut input[type=range]{flex:1;padding:0}.cuts .cut input[type=number]{width:84px;flex:none}
.cuts .cut button{padding:4px 10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:16px;align-items:start}.wl{position:sticky;top:8px}@media(max-width:900px){.work{grid-template-columns:1fr}.wl{position:static}}
#stage{position:relative}#stage canvas{width:100%;height:auto;aspect-ratio:4/3;display:block;border:1px solid var(--st-border,#333);border-radius:8px;background:rgba(127,127,127,.08);cursor:grab;touch-action:none}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pl .chip small{opacity:.7}
.hint{font-size:12px;opacity:.7}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg>div{flex:1;min-width:140px}
h2{font-size:14px;margin:0 0 6px}
.oc{margin-top:16px;padding-top:12px;border-top:1px solid var(--st-border,#333)}.oc .btns{margin-top:10px}
</style>
<h1 id="t_title"></h1>
<p class="sub" id="t_intro"></p>
<div class="card">
  <div id="pick">
    <label id="t_search"></label>
    <input id="q" type="search" autocomplete="off">
    <div class="files" id="files"></div>
  </div>
</div>
<div class="card work" id="work" style="display:none">
  <div class="wl">
    <div id="stage"><canvas id="cvg" width="800" height="600"></canvas><canvas id="cv" width="800" height="600" style="display:none"></canvas></div>
    <div class="pl" id="pl"></div>
    <div id="exrow" style="display:none;margin-top:8px"><label id="t_explode"></label><input id="explode" type="range" min="0" max="100" value="35"></div>
  </div>
  <div class="wr">
    <h2 id="t_cuth"></h2>
    <div class="hint" id="t_dims"></div>
    <div class="btns" id="addbtns"><button type="button" id="ax_x"></button><button type="button" id="ax_y"></button><button type="button" id="ax_z"></button><button type="button" id="auto"></button></div>
    <div class="cuts" id="cuts"></div>
    <div class="seg" style="margin-top:8px">
      <div><label id="t_bw"></label><input id="bw" type="number" min="20" value="220"></div>
      <div><label id="t_bd"></label><input id="bd" type="number" min="20" value="220"></div>
      <div><label id="t_bh"></label><input id="bh" type="number" min="20" value="250"></div>
    </div>
    <h2 id="t_cnh" style="margin-top:16px"></h2>
    <div class="seg">
      <div><label id="t_joint"></label><select id="joint"><option value="peg"></option><option value="dowel"></option><option value="magnet"></option><option value="none"></option></select></div>
      <div id="shapebox"><label id="t_shape"></label><select id="shape"><option value="round"></option><option value="square"></option><option value="cross"></option></select></div>
      <div><label id="t_fit"></label><select id="fit"><option value="0.1"></option><option value="0.2" selected></option><option value="0.35"></option></select></div>
    </div>
    <div class="seg">
      <div><label id="t_csize"></label><input id="csize" type="number" min="3" max="40" step="0.5" value="8"></div>
      <div><label id="t_clen"></label><input id="clen" type="number" min="2" max="40" step="0.5" value="8"></div>
      <div><label id="t_cclr"></label><input id="cclr" type="number" min="0" max="1" step="0.05" value="0.2"></div>
      <div id="mdbox" style="display:none"><label id="t_md"></label><input id="md" type="number" min="1" max="20" step="0.5" value="3"></div>
    </div>
    <div class="hint" id="t_jointh" style="margin-top:6px"></div>
    <div class="btns"><button type="button" id="preview"></button></div>
<div id="outcard" class="oc" style="display:none">
    <div class="row"><div><label id="t_name"></label><input id="name" maxlength="120"></div></div>
    <div>
      <label id="t_src"></label>
      <div class="srcrow"><select id="src"></select><div class="dsel"><button type="button" id="mkopen"></button><button type="button" id="browse" class="ico"></button></div></div>
      <div class="hint" id="t_savehint" style="margin-top:6px"></div>
      <div class="here" id="here"></div>
    </div>
    <label class="chk"><input type="checkbox" id="guide" checked><span id="t_guide"></span></label>
    <div class="btns"><button id="run" class="primary" disabled></button><button type="button" id="chg" style="display:none"></button></div>
    <div id="msg"></div>
  </div>
  </div>
</div>
<script>
const T={
fr:{change:'Changer de modèle',title:'Découpe 3D',intro:'Découpe un modèle 3MF ou STL en pièces qui tiennent sur le plateau, avec connecteurs d\'emboîtement, pièces posées à plat et guide d\'assemblage PDF. Le fichier d\'origine n\'est pas modifié.',
 search:'Rechercher un modèle (3MF / STL) de la bibliothèque',none:'Aucun modèle trouvé.',pick:'Choisissez d\'abord un modèle.',busy:'Traitement…',
 cuth:'Plans de coupe',dims:'Dimensions : {x} × {y} × {z} mm',ax_x:'+ Coupe X',ax_y:'+ Coupe Y',ax_z:'+ Coupe Z',auto:'Automatique selon le plateau',
 bw:'Plateau : largeur (mm)',bd:'Plateau : profondeur (mm)',bh:'Hauteur max d\'impression (mm)',del:'Supprimer',
 cnh:'Connecteurs d\'emboîtement',joint:'Type de jonction',j_peg:'Tenon + logement (mâle / femelle)',j_dowel:'Logements + tige libre (femelle / femelle)',j_magnet:'Logements d\'aimant',j_none:'Aucun connecteur',
 shape:'Forme',s_round:'Rond',s_square:'Carré',s_cross:'Croix',fit:'Ajustement',f_tight:'Serré (0,1 mm)',f_norm:'Normal (0,2 mm)',f_loose:'Lâche (0,35 mm)',

 preview:'Aperçu des pièces',explode:'Éclater',pieces:'{n} pièces',
 name:'Nom du nouveau fichier',src:'Enregistrer dans (source)',savehint:'Choisis où enregistrer le 3MF et le guide.',guide:'Créer aussi le guide d\'assemblage (PDF)',run:'Découper et créer le 3MF',
 fin:'Terminé',done:'{p} pièces, {c} connecteur(s) — {f}',pdf:'guide : {g}',dow:'{n} tige(s) libre(s) à imprimer',big:'Attention : une pièce dépasse le plateau indiqué.',
 outside:'Ce dossier n\'est dans aucune de tes sources : ajoute-le d\'abord comme source, ou choisis un dossier de la liste.',
 mkenter:'Entrez le nom du nouveau dossier',mkph:'Nom du dossier',cancel:'Annuler',create:'Créer',browse:'Parcourir',selfold:'Veuillez sélectionner un dossier.',mkopen:'Créer un dossier...',here:'Enregistrement dans : ',same:'Dossier du fichier d\'origine',nocut:'Ajoutez au moins un plan de coupe.',autoNone:'Le modèle tient déjà sur le plateau : aucune coupe nécessaire.'},
en:{change:'Change model',title:'3D cutter',intro:'Cuts a 3MF or STL model into pieces that fit your bed, with alignment connectors, pieces laid flat and a PDF assembly guide. The original file is never modified.',

 cuth:'Cut planes',dims:'Size: {x} × {y} × {z} mm',ax_x:'+ X cut',ax_y:'+ Y cut',ax_z:'+ Z cut',auto:'Automatic for the bed',

};
let L='fr',sel=null,sources=[],size=null,model=null,cuts=[],pieces=null;
const $=id=>document.getElementById(id),t=k=>(T[L]||T.en)[k]||T.en[k]||k;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function labels(){
  const m={t_title:'title',t_intro:'intro',t_search:'search',t_cuth:'cuth',t_bw:'bw',t_bd:'bd',t_bh:'bh',t_cnh:'cnh',t_joint:'joint',t_shape:'shape',t_fit:'fit',t_csize:'csize',t_clen:'clen',t_cclr:'cclr',t_md:'md',t_name:'name',t_src:'src',t_guide:'guide',t_explode:'explode'};
  for(const k in m)$(k).textContent=t(m[k]);
  ['x','y','z'].forEach(a=>$('ax_'+a).textContent=t('ax_'+a));$('auto').textContent=t('auto');$('preview').textContent=t('preview');$('run').textContent=t('run');
  const o=(id,keys)=>[...$(id).options].forEach((op,i)=>op.textContent=t(keys[i]));
  o('joint',['j_peg','j_dowel','j_magnet','j_none']);o('shape',['s_round','s_square','s_cross']);o('fit',['f_tight','f_norm','f_loose']);
  $('mkopen').innerHTML='<span class="mi">'+ICO_PLUS+'</span> ';$('mkopen').appendChild(document.createTextNode(t('mkopen')));$('browse').innerHTML=ICO_OPEN;$('browse').title=t('browse');$('t_savehint').textContent=t('savehint');
  jointUi();showDims();
}
function msg(txt,cls){const m=$('msg');m.textContent=cls==='busy'?String(txt).replace(/[….]+$/,''):txt;m.className=cls||'';if(cls==='busy'){const d=document.createElement('span');d.className='dots';d.innerHTML='<i></i><i></i><i></i>';m.appendChild(d)}m.style.display=txt?'block':'none'}
function finished(d){const m=$('msg');m.className='finished';m.innerHTML='';
  const k=document.createElement('div');k.className='tick';k.textContent='✓';const w=document.createElement('div');
  const b=document.createElement('b');b.textContent=t('fin')+' — '+t('done').replace('{p}',d.piece_count).replace('{c}',d.connectors).replace('{f}',d.output_filename);w.appendChild(b);
  const parts=[];if(d.guide)parts.push(t('pdf').replace('{g}',d.guide));if(d.dowels)parts.push(t('dow').replace('{n}',d.dowels));if(d.too_big)parts.push(t('big'));
  const sm=document.createElement('small');sm.style.display='block';sm.textContent=parts.join(' · ');if(sm.textContent)w.appendChild(sm);
  m.appendChild(k);m.appendChild(w);m.style.display='flex';try{m.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}}
const thumbs=new Map();
function mime(b){const u=new Uint8Array(b);if(u[0]===0x89&&u[1]===0x50)return'image/png';if(u[0]===0xff&&u[1]===0xd8)return'image/jpeg';return'image/webp'}
let thN=0;const thQ=[];   // au plus 3 miniatures demandées en même temps : l'application reste fluide
function thNext(){while(thN<3&&thQ.length){const j=thQ.shift();thN++;j().finally(()=>{thN--;thNext()})}}
function thumbUrl(path){
  if(!thumbs.has(path))thumbs.set(path,new Promise(ok=>{thQ.push(()=>window.stellio.api('/api/thumb?path='+encodeURIComponent(path),'arraybuffer')
    .then(b=>ok(URL.createObjectURL(new Blob([b],{type:mime(b)})))).catch(()=>ok(null)));thNext()}));
  return thumbs.get(path);
}
function fill(el,path){thumbUrl(path).then(u=>{if(u){el.innerHTML='';const i=new Image();i.alt='';i.src=u;el.appendChild(i)}})}
let io=null;
function lazy(el,path){
  if(!('IntersectionObserver' in window))return fill(el,path);
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fill(e.target,e.target.dataset.p)}}),{root:$('files'),rootMargin:'120px'});
  el.dataset.p=path;io.observe(el);
}
function collapse(on){const c=$('pick').closest('.card');c.style.display=on?'none':'';if(!on){try{c.scrollIntoView({block:'nearest'})}catch(e){}}}
$('chg').onclick=()=>collapse(false);
function showBig(){const b=$('chg');b.style.display=sel?'':'none';b.textContent=t('change')}

async function search(){
  try{const d=await window.stellio.api('/api/x/mesh-cut/files?q='+encodeURIComponent($('q').value.trim()));
    const box=$('files');if(io)io.disconnect();
    box.innerHTML=(d.files||[]).map((f,i)=>`<div class="f${sel&&sel.path===f.path?' sel':''}" data-i="${i}" title="${esc(f.path)}"><div class="th"><i>&#9638;</i></div><div class="nm">${esc(f.name)}</div></div>`).join('')||`<div class="none">${esc(t('none'))}</div>`;
    box.querySelectorAll('.f').forEach(el=>{const f=d.files[+el.dataset.i];lazy(el.querySelector('.th'),f.path);
      el.onclick=()=>{box.querySelectorAll('.f').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');choose(f)}});
  }catch(e){msg(e.message,'err')}
}
async function choose(f){
  sel=f;showBig();collapse(true);cuts=[];pieces=null;model=null;$('pl').innerHTML='';$('exrow').style.display='none';$('run').disabled=true;msg('');
  $('name').value=f.name.replace(/\.(3mf|stl)$/i,'')+'_decoupe';
  $('work').style.display='';$('outcard').style.display='block';renderCuts();
  msg(t('busy'),'busy');
  try{const d=await window.stellio.api('/api/x/mesh-cut/model','json',{method:'POST',body:{path:f.path}});
    if(sel!==f)return;size=d.size;model=prep(d.preview);showDims();msg('');draw();$('run').disabled=false}
  catch(e){msg(e.message,'err')}

  let o=[...$('src').options].find(x=>x.value===sid+'|');if(!o)return false;
  await expand(o);const parts=sub?sub.split('/'):[];let acc='';
  for(const p of parts){acc=acc?acc+'/'+p:p;const n=[...$('src').options].find(x=>x.value===sid+'|'+acc);if(!n)break;o=n;await expand(o)}
  $('src').value=o.value;await pickDest();return true}
async function browse(){
  try{const d=await window.stellio.api('/api/x/mesh-cut/browse','json',{method:'POST',body:{}});
    if(!(await selectPath(String(d.source_id),d.sub||'')))msg(t('outside'),'err');else msg('')}
  catch(e){const m=String(e&&e.message||'');if(/annul|cancel/i.test(m))return false;
    msg(/n'est dans aucune|aucune de tes sources|outside/i.test(m)?t('outside'):m,'err');return false}
  return true}

async function openMk(){
  if(!curSid)await browse();                                                        // comme pour les téléchargements : sans dossier choisi, l'explorateur s'ouvre
  if(!curSid&&$('src').options.length>1){$('src').selectedIndex=1;await pickDest()}   // explorateur indisponible : première source
  if(!curSid)return;
  const ov=document.createElement('div');ov.className='mo';const md=document.createElement('div');md.className='md';ov.appendChild(md);
  const h=document.createElement('h3');h.innerHTML='<span class="mi">'+ICO_PLUS+'</span>';const ht=document.createElement('span');ht.textContent=t('mkopen');h.appendChild(ht);md.appendChild(h);
  const p=document.createElement('p');p.textContent=t('mkenter');md.appendChild(p);
  const err=document.createElement('p');err.style.cssText='color:var(--st-danger,#ef4444);margin:-8px 0 12px;display:none';md.appendChild(err);
  const inp=document.createElement('input');inp.maxLength=50;inp.placeholder=t('mkph');md.appendChild(inp);
  const bt=document.createElement('div');bt.className='bt';const c=document.createElement('button');c.type='button';c.textContent=t('cancel');
  const ok=document.createElement('button');ok.type='button';ok.className='primary';ok.textContent=t('create');bt.appendChild(c);bt.appendChild(ok);md.appendChild(bt);
  const close=()=>ov.remove();c.onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
  const go=async()=>{const name=inp.value.trim();if(!name){inp.style.borderColor='var(--st-danger,#ef4444)';return}
    ok.disabled=true;try{await createIn(name);close()}catch(e){err.textContent=e.message;err.style.display='block';ok.disabled=false}};
  ok.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}else if(e.key==='Escape')close()};
  document.body.appendChild(ov);setTimeout(()=>inp.focus(),50);
}

function body(extra){return Object.assign({path:sel&&sel.path,cuts:cuts.map(c=>({axis:c.axis,pos:c.pos})),bed_width:+$('bw').value||220,bed_depth:+$('bd').value||220,bed_height:+$('bh').value||250,
  joint:$('joint').value,shape:$('shape').value,conn_size:+$('csize').value||8,conn_length:+$('clen').value||8,conn_clearance:$('cclr').value===''?0.2:+$('cclr').value,magnet_depth:+$('md').value||3,
  guide:$('guide').checked,lang:L,filename:$('name').value.trim(),source_id:curSid,target_subfolder:curSid?cur:''},extra||{})}
let JOB=null,JOBX=false;
const CXL={fr:['Annuler','Annulé.'],en:['Cancel','Cancelled.'],de:['Abbrechen','Abgebrochen.'],es:['Cancelar','Cancelado.'],it:['Annulla','Annullato.'],pt:['Cancelar','Cancelado.'],zh:['取消','已取消。'],ja:['キャンセル','キャンセルしました。']};
function cxl(i){return(CXL[L]||CXL.en)[i]}
function cxlBtn(on){document.querySelectorAll('.cxl').forEach(b=>b.remove());if(!on)return;
  const a=['run','r_run'].map(id=>document.getElementById(id)).find(e=>e&&e.offsetParent);if(!a)return;
  const b=document.createElement('button');b.type='button';b.className='cxl';b.textContent=cxl(0);
  b.onclick=()=>{if(!JOB)return;JOBX=true;b.disabled=true;window.stellio.api('/api/jobs/'+encodeURIComponent(JOB)+'/cancel','json',{method:'POST'}).catch(()=>{})};
  a.insertAdjacentElement('afterend',b)}
async function runJob(path,body){
  const r=await window.stellio.api(path,'json',{method:'POST',body:Object.assign({async:true},body)});
  if(!r||!r.job_id)return r;                       // ancienne version de Stellio : réponse directe
  JOB=r.job_id;JOBX=false;cxlBtn(true);
  try{for(;;){await new Promise(z=>setTimeout(z,JOBX?150:600));
    const j=await window.stellio.api('/api/jobs/'+encodeURIComponent(r.job_id));
    if(j.state==='done'){const R=j.result||{};if(R.status>=400)throw new Error((R.body&&R.body.error)||'Erreur');return R.body}
    if(j.state==='cancelled'||JOBX)throw new Error(cxl(1));
    if(j.state==='failed')throw new Error(j.error||j.state)}}
  finally{JOB=null;cxlBtn(false)}}
async function call(extra){const b=body(extra);return b.dry_run?window.stellio.api('/api/x/mesh-cut/cut','json',{method:'POST',body:b}):runJob('/api/x/mesh-cut/cut',b)}
function chips(list){$('pl').innerHTML=list.map(p=>`<span class="chip"><i style="background:${esc(p.hex)}"></i>${p.n} <small>${p.size.join(' × ')}</small></span>`).join('')}

  catch(e){msg(e.message,'err')}finally{$('run').disabled=false}};
let timer;$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,250)};

labels();
