<style>
html,body{background:transparent}
body{margin:0;padding:16px;color:var(--st-text,#eee);font:14px/1.5 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--st-muted,#999)}
.card{background:var(--st-card,#1b1b1b);border:1px solid var(--st-border,#333);border-radius:8px;padding:14px;margin-bottom:12px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:inherit;margin:10px 0 0}label.chk input{width:auto}
label{display:block;font-size:12px;color:var(--st-muted,#999);margin:8px 0 3px}
input,select{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--st-border,#333);background:var(--st-panel,#161616);color:inherit;font:inherit;cursor:pointer}
button.primary{background:var(--st-accent,#4ea1d3);border-color:transparent;color:#fff}
button:disabled{opacity:.5;cursor:default}
.files{max-height:380px;overflow:auto;margin-top:8px;padding:8px;border:1px solid var(--st-border,#333);border-radius:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.files .f{cursor:pointer;border:1px solid var(--st-border,#333);border-radius:8px;overflow:hidden;background:var(--st-panel,#161616);display:flex;flex-direction:column}
.files .f.sel{outline:2px solid var(--st-accent,#4ea1d3);background:color-mix(in srgb,var(--st-accent,#4ea1d3) 22%,transparent)}
.files .th{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.12);font-size:26px;opacity:1}
.files .th img{width:100%;height:100%;object-fit:contain;display:block}
.files .nm{padding:5px 7px;font-size:12px;line-height:1.25;word-break:break-all;max-height:3.9em;overflow:hidden}
.files .none{grid-column:1/-1;padding:6px}
#dest{display:none;flex:2 1 320px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0 6px;font-size:13px}
.crumb button{padding:2px 8px;font-size:12px}
.dirs{max-height:170px;overflow:auto;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.dirs div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--st-border,#333);display:flex;gap:8px;align-items:center}
.dirs div:last-child{border-bottom:0}.dirs div:hover{background:color-mix(in srgb,var(--st-accent,#4ea1d3) 16%,transparent)}
.dirs .none{cursor:default;opacity:.7}.dirs .none:hover{background:none}
.srcrow{display:flex;gap:8px;align-items:center}.srcrow select{flex:1 1 0;width:auto;min-width:0}.srcrow .dsel{margin-top:0;flex:none}
.dsel{display:flex;gap:8px;align-items:center;margin-top:8px}.dsel button{background:transparent;border-color:transparent;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.dsel button:hover{background:color-mix(in srgb,var(--st-text,#eee) 8%,transparent)}.dsel #mkopen{flex:1}.mi{display:inline-flex;color:var(--st-accent,#4ea1d3)}.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50}.mo .md{background:var(--st-panel,#1e2129);border:1px solid var(--st-border,#2a2f3a);border-radius:16px;padding:28px;max-width:450px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.6)}.mo h3{margin:0 0 14px;font-size:18px;display:flex;gap:12px;align-items:center}.mo h3 .mi svg{width:24px;height:24px}.mo p{margin:0 0 14px;opacity:.75;line-height:1.5}.mo input{padding:12px 16px;border:2px solid var(--st-border,#2a2f3a);border-radius:10px;margin-bottom:20px;background:var(--st-bg,#161a22)}.mo input:focus{outline:none;border-color:var(--st-accent,#4ea1d3);box-shadow:0 0 0 3px color-mix(in srgb,var(--st-accent,#4ea1d3) 35%,transparent)}.mo .bt button:not(.primary){background:var(--st-hover,#2a2f3a)}.mo .bt{display:flex;gap:12px;justify-content:flex-end}.mo .bt button{padding:11px 24px;border-radius:10px;border:none}.mo .bt .primary{font-weight:600}.mk{display:flex;gap:8px;margin-top:8px}.mk input{flex:1}
.here{margin-top:6px;font-size:12px;opacity:.85}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dotb 1.2s infinite ease-in-out both}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
#view{display:none;margin-top:14px}
#view .hint{font-size:12px;opacity:.7;margin-bottom:8px}
#view .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#view .card{border:1px solid var(--st-border,#333);border-radius:8px;background:var(--st-panel,#161616);overflow:hidden}
#view canvas{width:100%;height:auto;aspect-ratio:1;display:block;cursor:grab;touch-action:none}
#view .cap{padding:5px 8px;font-size:12px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--st-border,#333)}
#view .cap i{width:12px;height:12px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#big{display:none;margin-top:10px;gap:12px;align-items:center}
#big img{width:96px;height:96px;object-fit:contain;border-radius:8px;border:1px solid var(--st-border,#333);background:rgba(127,127,127,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--st-border,#333);border-radius:6px;background:var(--st-panel,#161616)}
.chip i{width:14px;height:14px;border-radius:3px;border:1px solid var(--st-border,#333);display:inline-block}
#msg{margin-top:10px;padding:9px 11px;border-radius:6px;border:1px solid var(--st-border,#333);display:none}
#msg.finished{display:flex!important;align-items:center;gap:14px;padding:16px 18px;border:2px solid var(--st-success,#30a46c);background:color-mix(in srgb,var(--st-success,#30a46c) 14%,transparent);animation:pop .45s ease-out}#msg.finished .tick{flex:none;width:38px;height:38px;border-radius:50%;background:var(--st-success,#30a46c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}#msg.finished b{display:block;font-size:15px}#msg.finished small{opacity:.8}@keyframes pop{0%{transform:scale(.96);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
#msg.err{border-color:var(--st-danger,#e5484d)}#msg.ok{border-color:var(--st-success,#30a46c)}

.work{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.wl{flex:1 1 380px;min-width:0;max-width:min(800px,calc((100vh - 250px)*4/3))}.wr{flex:2 1 560px;min-width:240px;max-width:780px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}.wr>div{min-width:0}.c1{display:flex;flex-direction:column;min-height:0}.sec{flex:1 1 0;min-height:130px;margin-top:14px;border:1px solid var(--st-border,#333);border-radius:8px;padding:10px;display:flex;flex-direction:column}.sec h2{flex:none}.sec .slots{flex:1 1 0;min-height:0;overflow-y:auto}@media(max-width:1250px){.wr{grid-template-columns:1fr}.sec{flex:none}.sec .slots{max-height:230px}}
#stage{position:relative;border:1px solid var(--st-border,#333);border-radius:8px;background:radial-gradient(circle at 50% 40%,rgba(127,127,127,.18),rgba(127,127,127,.05));overflow:hidden;touch-action:none}
#cvg{display:block;width:100%;height:auto;aspect-ratio:4/3}
#ring{position:absolute;display:none;border:2px solid #fff;box-shadow:0 0 0 1px #000;border-radius:50%;pointer-events:none}
h2{font-size:14px;margin:0 0 6px}
.tools,.btns{display:flex;flex-wrap:wrap;gap:6px}.tools button.on{background:var(--st-accent,#4ea1d3);border-color:transparent;color:#fff}
.btns{margin-top:8px}
.slots{display:flex;flex-direction:column;gap:4px}.slot{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--st-border,#333);border-radius:6px;cursor:pointer;background:var(--st-panel,#161616)}
.slot.on{outline:2px solid var(--st-accent,#4ea1d3)}.slot i,.sp i{width:18px;height:18px;border-radius:4px;border:1px solid rgba(127,127,127,.6);flex:none;display:inline-block}
.slot span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot small{opacity:.7}.slot .x{padding:0 6px;border:0;background:transparent}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:170px;overflow:auto;margin-top:8px}
.sp{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 8px}.sp span{min-width:0;display:flex;flex-direction:column}.sp b{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp small{opacity:.7;font-size:11px}
.custom{grid-column:1/-1}.custom input{height:34px;padding:2px}
.seg{display:flex;gap:10px;flex-wrap:wrap}.seg>div{flex:1;min-width:120px}
#msg0{margin-top:6px;font-size:12px;opacity:.85}
.oc{margin-top:16px;padding-top:12px;border-top:1px solid var(--st-border,#333)}.oc .btns{margin-top:10px}.oc .row>div{min-width:120px}
.seg.rg>div{flex:1 1 100%}.seg.rg label{white-space:nowrap}
</style>
<h1 id="t_title"></h1>
<p class="sub" id="t_intro"></p>
<div class="card">
  <div id="pick">
    <label id="t_search"></label>
    <input id="q" type="search" autocomplete="off">
    <div class="files" id="files"></div>
  </div>
</div>
<div id="msg0" class="hint"></div>
<div class="card work" id="work" style="display:none">
  <div class="wl">
    <div id="stage"><canvas id="cvg" width="800" height="600"></canvas><div id="ring"></div></div>
    <div class="hint" id="t_hint" style="margin-top:6px"></div>
  </div>
  <div class="wr">
   <div class="c1">
    <h2 id="t_tools"></h2>
    <div class="tools" id="tools"></div>
    <div class="seg rg" style="margin-top:6px">
      <div><label><span id="t_rad"></span> : <b id="radv"></b></label><input id="rad" type="range" min="0.5" max="30" step="0.5" value="4"></div>
      <div><label><span id="t_ang"></span> : <b id="angv"></b></label><input id="ang" type="range" min="5" max="85" step="1" value="30"></div>
    </div>
    <div class="btns"><button type="button" id="undo"></button><button type="button" id="redo"></button></div>
    <div class="sec"><h2 id="t_slots"></h2>
    <div class="slots" id="slots"></div></div>
   </div>
   <div class="c2">
    <h2 id="t_stock" style="margin-top:0"></h2>
    <div class="seg"><div><input id="ps" type="search" autocomplete="off"></div><div><select id="pm"></select></div></div>
    <label class="chk"><input type="checkbox" id="ph" checked><span id="t_hide"></span></label>
    <div class="stock" id="stock"></div>
  <div id="outcard" class="oc" style="display:none">
    <div class="row"><div><label id="t_name"></label><input id="name" maxlength="120"></div>
      <div><label id="t_bw"></label><input id="bw" type="number" min="20" value="256"></div><div><label id="t_bd"></label><input id="bd" type="number" min="20" value="256"></div></div>
    <div>
      <label id="t_src"></label>
      <div class="srcrow"><select id="src"></select><div class="dsel"><button type="button" id="mkopen"></button><button type="button" id="browse" class="ico"></button></div></div>
      <div class="hint" id="t_savehint" style="margin-top:6px"></div>
      <div class="here" id="here"></div>
    </div>
    <div class="btns"><button id="run" class="primary" disabled></button><button type="button" id="chg" style="display:none"></button></div>
    <div id="msg"></div>
  </div>
   </div>
  </div>
</div>
<script>
const T={
fr:{title:'Peinture filaments',intro:'Peins un modèle 3MF ou STL avec les couleurs des bobines de ton stock, puis crée un 3MF peint (une couleur = un filament) prêt pour Bambu Studio / OrcaSlicer. Le fichier d\'origine n\'est pas modifié.',
 search:'Rechercher un modèle (3MF / STL) de la bibliothèque',none:'Aucun modèle trouvé.',change:'Changer de modèle',pick:'Choisissez d\'abord un modèle.',busy:'Traitement…',loading:'Chargement du modèle…',
 tools:'Outils',brush:'Pinceau',bucket:'Pot de peinture',fillall:'Tout remplir',erase:'Gomme',rotate:'Tourner',rad:'Rayon du pinceau (mm)',ang:'Angle max du pot (°)',undo:'Annuler',redo:'Rétablir',
 slots:'Filaments utilisés',stock:'Mon stock de filament',searchph:'Rechercher une bobine…',allmat:'Toutes les matières',hide:'Masquer les bobines vides',nostock:'Aucune bobine dans le stock (page Matières). Choisis une couleur libre ci-dessous.',
 custom:'Couleur libre',base:'base',remove:'Retirer',chbase:'Changer la couleur de base',pickbase:'Choisis la nouvelle couleur de base dans ton stock.',
 hint:'Clic gauche : peindre · clic droit ou outil « Tourner » : faire pivoter · clic molette (ou Maj + glisser) : déplacer · molette : zoom vers le curseur · double-clic en mode « Tourner » : recentrer. Choisis d\'abord la couleur de base (filament 1), elle recouvre tout le modèle.',
 first:'Choisis d\'abord une couleur dans ton stock : elle sera la couleur de base.',maxslots:'16 filaments au maximum.',
 name:'Nom du nouveau fichier',bw:'Plateau : largeur (mm)',bd:'Plateau : profondeur (mm)',src:'Enregistrer dans (source)',savehint:'Choisis où enregistrer le 3MF peint.',run:'Créer le 3MF peint',
 fin:'Terminé',done:'{c} couleur(s) — {f}',outside:'Ce dossier n\'est dans aucune de tes sources : ajoute-le d\'abord comme source, ou choisis un dossier de la liste.',
 mkenter:'Entrez le nom du nouveau dossier',mkph:'Nom du dossier',cancel:'Annuler',create:'Créer',browse:'Parcourir',selfold:'Veuillez sélectionner un dossier.',mkopen:'Créer un dossier...',here:'Enregistrement dans : ',same:'Dossier du fichier d\'origine',
 info:'{x} × {y} × {z} mm · {n} faces',reduced:' (édition sur un maillage allégé, export sur le modèle complet)',refined:' (maillage affiné pour peindre précisément : {m} faces)',g:'g'},
en:{title:'Filament painter',intro:'Paint a 3MF or STL model with the colors of the spools in your stock, then create a painted 3MF (one color = one filament) ready for Bambu Studio / OrcaSlicer. The original file is never modified.',
 search:'Search a model (3MF / STL) in the library',none:'No model found.',change:'Change model',pick:'Pick a model first.',busy:'Working…',loading:'Loading the model…',
 tools:'Tools',brush:'Brush',bucket:'Paint bucket',fillall:'Fill all',erase:'Eraser',rotate:'Rotate',rad:'Brush radius (mm)',ang:'Bucket max angle (°)',undo:'Undo',redo:'Redo',
 slots:'Filaments used',stock:'My filament stock',searchph:'Search a spool…',allmat:'All materials',hide:'Hide empty spools',nostock:'No spool in the stock (Materials page). Pick a free color below.',
 custom:'Free color',base:'base',remove:'Remove',chbase:'Change the base color',pickbase:'Pick the new base color from your stock.',
 hint:'Left click: paint · right click or the “Rotate” tool: rotate · middle click (or Shift + drag): pan · wheel: zoom to cursor · double-click in “Rotate” mode: reset the view. First pick the base color (filament 1): it covers the whole model.',
 first:'First pick a color from your stock: it will be the base color.',maxslots:'16 filaments maximum.',
 name:'New file name',bw:'Bed width (mm)',bd:'Bed depth (mm)',src:'Save to (source)',savehint:'Choose where to save the painted 3MF.',run:'Create the painted 3MF',
 fin:'Done',done:'{c} color(s) — {f}',outside:'This folder is not in any of your sources: add it as a source first, or pick a folder from the list.',
 mkenter:'Enter the new folder name',mkph:'Folder name',cancel:'Cancel',create:'Create',browse:'Browse',selfold:'Please select a folder.',mkopen:'Create a folder...',here:'Saving to: ',same:'Folder of the original file',
 info:'{x} × {y} × {z} mm · {n} faces',reduced:' (editing on a lighter mesh, export on the full model)',refined:' (mesh refined for precise painting: {m} faces)',g:'g'}
};
let L='fr',sel=null,sources=[],M=null,stock=[],slots=[],active=0,tool='brush';
const $=id=>document.getElementById(id),t=k=>(T[L]||T.en)[k]||T.en[k]||k;
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const TOOLS=['brush','bucket','fillall','erase','rotate'];
function labels(){
  const m={t_title:'title',t_intro:'intro',t_search:'search',t_tools:'tools',t_rad:'rad',t_ang:'ang',t_slots:'slots',t_stock:'stock',t_hide:'hide',t_hint:'hint',t_name:'name',t_bw:'bw',t_bd:'bd',t_src:'src'};
  for(const k in m)$(k).textContent=t(m[k]);
  $('undo').textContent=t('undo');$('redo').textContent=t('redo');$('run').textContent=t('run');$('ps').placeholder=t('searchph');
  $('tools').innerHTML=TOOLS.map(k=>`<button type="button" data-tool="${k}" class="${k===tool?'on':''}">${esc(t(k))}</button>`).join('');
  $('tools').querySelectorAll('button').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;labels()});
  $('radv').textContent=$('rad').value;$('angv').textContent=$('ang').value;
  $('mkopen').innerHTML='<span class="mi">'+ICO_PLUS+'</span> ';$('mkopen').appendChild(document.createTextNode(t('mkopen')));$('browse').innerHTML=ICO_OPEN;$('browse').title=t('browse');$('t_savehint').textContent=t('savehint');
  renderStock();renderSlots();
}
function msg(txt,cls){const m=$('msg');m.textContent=cls==='busy'?String(txt).replace(/[….]+$/,''):txt;m.className=cls||'';if(cls==='busy'){const d=document.createElement('span');d.className='dots';d.innerHTML='<i></i><i></i><i></i>';m.appendChild(d)}m.style.display=txt?'block':'none'}
function finished(d){const m=$('msg');m.className='finished';m.innerHTML='';
  const k=document.createElement('div');k.className='tick';k.textContent='✓';const w=document.createElement('div');
  const b=document.createElement('b');b.textContent=t('fin')+' — '+t('done').replace('{c}',d.colors).replace('{f}',d.output_filename);w.appendChild(b);
  const sm=document.createElement('small');sm.style.display='block';sm.textContent=d.share.map((p,i)=>slots[i]?slots[i].name+' '+p+'%':'').filter(Boolean).join(' · ');w.appendChild(sm);
  m.appendChild(k);m.appendChild(w);m.style.display='flex';try{m.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}}
const thumbs=new Map();
function mime(b){const u=new Uint8Array(b);if(u[0]===0x89&&u[1]===0x50)return'image/png';if(u[0]===0xff&&u[1]===0xd8)return'image/jpeg';return'image/webp'}
let thN=0;const thQ=[];   // au plus 3 miniatures demandées en même temps : l'application reste fluide
function thNext(){while(thN<3&&thQ.length){const j=thQ.shift();thN++;j().finally(()=>{thN--;thNext()})}}
function thumbUrl(path){
  if(!thumbs.has(path))thumbs.set(path,new Promise(ok=>{thQ.push(()=>window.stellio.api('/api/thumb?path='+encodeURIComponent(path),'arraybuffer')
    .then(b=>ok(URL.createObjectURL(new Blob([b],{type:mime(b)})))).catch(()=>ok(null)));thNext()}));
  return thumbs.get(path);
}
function fill(el,path){thumbUrl(path).then(u=>{if(u){el.innerHTML='';const i=new Image();i.alt='';i.src=u;el.appendChild(i)}})}
let io=null;
function lazy(el,path){
  if(!('IntersectionObserver' in window))return fill(el,path);
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fill(e.target,e.target.dataset.p)}}),{root:$('files'),rootMargin:'120px'});
  el.dataset.p=path;io.observe(el);
}
async function search(){
  try{const d=await window.stellio.api('/api/x/paint-stock/files?q='+encodeURIComponent($('q').value.trim()));
    const box=$('files');if(io)io.disconnect();
    box.innerHTML=(d.files||[]).map((f,i)=>`<div class="f${sel&&sel.path===f.path?' sel':''}" data-i="${i}" title="${esc(f.path)}"><div class="th"><i>&#9638;</i></div><div class="nm">${esc(f.name)}</div></div>`).join('')||`<div class="none">${esc(t('none'))}</div>`;
    box.querySelectorAll('.f').forEach(el=>{const f=d.files[+el.dataset.i];lazy(el.querySelector('.th'),f.path);
      el.onclick=()=>{box.querySelectorAll('.f').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');choose(f)}});
  }catch(e){msg(e.message,'err')}
}
function collapse(on){const c=$('pick').closest('.card');c.style.display=on?'none':'';if(!on){try{c.scrollIntoView({block:'nearest'})}catch(e){}}}
$('chg').onclick=()=>collapse(false);
function showBig(){const b=$('chg');b.style.display=sel?'':'none';b.textContent=t('change')}

/* ── stock de filament ── */
async function loadStock(){
  try{const d=await window.stellio.api('/api/filament/spools'),map=new Map();
    (d.slots||[]).forEach(s=>{let hx=String(s.color_hex||'').trim();if(/^[0-9a-f]{6}$/i.test(hx))hx='#'+hx;if(!/^#[0-9a-f]{6}$/i.test(hx))return;hx=hx.toUpperCase();
      const key=[s.name,s.material,hx].join('|'),rem=(s.remaining_g==null?null:+s.remaining_g);
      if(map.has(key)){const o=map.get(key);o.rem=(o.rem==null||rem==null)?null:o.rem+rem;o.count++}else map.set(key,{hex:hx,name:s.name||hx,type:s.material||'PLA',rem,count:1})});
    stock=[...map.values()]}catch(e){stock=[]}
  const mats=[...new Set(stock.map(s=>s.type).filter(Boolean))].sort();
  $('pm').innerHTML=`<option value="">${esc(t('allmat'))}</option>`+mats.map(x=>`<option>${esc(x)}</option>`).join('');renderStock()}
function renderStock(){
  const q=$('ps').value.trim().toLowerCase(),mat=$('pm').value,hide=$('ph').checked,box=$('stock');
  const list=stock.filter(s=>(!mat||s.type===mat)&&(!q||(s.name+' '+s.type).toLowerCase().includes(q))&&!(hide&&s.rem!=null&&s.rem<=0));
  box.innerHTML=(list.map((s,i)=>`<button type="button" class="sp" data-i="${i}" title="${esc(s.name)} · ${esc(s.type)}"><i style="background:${esc(s.hex)}"></i><span><b>${esc(s.name)}</b><small>${esc(s.type)}${s.rem!=null?' · '+Math.round(s.rem)+' '+esc(t('g')):''}</small></span></button>`).join(''))||(stock.length?'':`<div class="hint">${esc(t('nostock'))}</div>`);
